[package]
name = "ultimate-server"
version = "0.1.0"
edition = "2024"
description = "Minecraft server (protocol version tracks the azalea dependency) built on the causal voxel engine"

[dependencies]
ultimate-engine = { path = "../engine" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# MC protocol codec (the azalea version PINS the supported MC version)
azalea-protocol = "0.16"
azalea-core = "0.16"
azalea-registry = "0.16"
azalea-buf = "0.16"
azalea-auth = "0.16"

azalea-block = "0.16"
azalea-chat = "0.16"
azalea-entity = "0.16"
azalea-crypto = "0.16"
azalea-world = "0.16"

# Web dashboard
axum = { version = "0.7", features = ["ws"] }

# World persistence (Anvil region files)
fastnbt = "2"
fastanvil = "0.31"
flate2 = "1"

# Supporting
anyhow = "1"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2.13.0"
azalea-inventory = "0.16"

# World generation
noise = "0.9"
dashmap = "6"
core_affinity = "0.8"

[dev-dependencies]
# Reads the vanilla client jar in examples/gen_vanilla_tags.rs
zip = { version = "2", default-features = false, features = ["deflate"] }
