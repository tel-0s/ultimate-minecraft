name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml (nightly, required by simdnbt)
      # and installs the pinned toolchain on first cargo invocation.
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check (all targets, including examples/benches)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --release
