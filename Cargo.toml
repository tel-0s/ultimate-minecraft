[workspace]
members = ["crates/engine", "crates/server"]
resolver = "2"

# MC 26.2 support is on azalea git but not yet published to crates.io
# (latest release is 0.16.0+mc26.1). Pin one rev so builds are
# reproducible; drop this whole section when 0.16.x+mc26.2 (or 0.17)
# is released.
[patch.crates-io]
azalea-protocol = { git = "https://github.com/azalea-rs/azalea", rev = "6249c295d353b9b3ef68f665b311cba39211fd19" }
